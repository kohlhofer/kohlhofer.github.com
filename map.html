<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map - Alexander Kohlhofer</title>
  <meta name="description" content="Map - Alexander Kohlhofer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=8.0, user-scalable=yes">

  <link rel="stylesheet" href="css/reset.min.css">
  <link rel="stylesheet" href="css/main.min.css">

  <link href="css/fa-fontawesome.min.css" rel="stylesheet">
  <link href="css/fa-brands.min.css" rel="stylesheet">
  <link href="css/fa-solid.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/map-page.min.css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-60NZPJR7DZ"></script>
  <script defer src="/js/analytics.js"></script>
  <link rel="canonical" href="https://kohlhofer.com/map">
</head>
<body>
  <div class="top-nav">
    <div class="nav-group nav-internal">
      <a href="/">← Home</a>
    </div>
  </div>

  <div id="nav-info-panel">
    <p>The map shows various cities I have lived and worked from and keeps track of places I visit.</p>
    <p>Created with <a href="https://d3js.org/" target="_blank">D3</a> - Here is to exploring!</p>
    <button class="close-button">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div id="map-page">
    <div id="map-container"></div>
    <div id="tooltip"></div>
    <div class="map-indicator">
      <span>drag to pan · scroll to zoom</span>
    </div>
    <div id="legend">
      <div class="legend-item">
        <div class="legend-color lived"></div>
        <span>Lived</span>
      </div>
      <div class="legend-item">
        <div class="legend-color visited"></div>
        <span>Visited</span>
      </div>
      <div class="legend-item">
        <div class="legend-color unvisited"></div>
        <span>Not Visited</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot"></div>
        <span>Visited City</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot path"></div>
        <span>Major Move</span>
      </div>
      <div class="legend-item">
        <div class="legend-line"></div>
        <span>Moved</span>
      </div>
    </div>
  </div>

  <script src="js/background.min.js"></script>
  <script src="js/map.min.js"></script>
  <script src="js/panel.min.js"></script>
  <script src="js/transitions.min.js"></script>
</body>
</html>
