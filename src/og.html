<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Social card source for images/og.png (1200x630).
       Regenerate with scripts/og-render.sh after editing this file. -->
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
      src: url('/fonts/inter-variable.woff2') format('woff2');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      background: #f9f9f7;
      color: #111111;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 96px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c8502d;
    }
    .rule {
      width: 64px;
      height: 6px;
      background: #c8502d;
      margin: 0 0 28px;
      border-radius: 2px;
    }
    .statement {
      font-size: 66px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.16;
    }
    .domain {
      font-size: 28px;
      font-weight: 500;
      color: #111111;
    }
    .mid { margin-top: auto; margin-bottom: auto; }
  </style>
</head>
<body>
  <p class="name">Alexander Kohlhofer</p>
  <div class="mid">
    <div class="rule"></div>
    <h1 class="statement">Founds companies.<br>Scales teams.<br>Builds software worth keeping.</h1>
  </div>
  <p class="domain">kohlhofer.com</p>
</body>
</html>
