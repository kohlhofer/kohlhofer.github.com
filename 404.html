<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Alexander Kohlhofer</title>
  <style>
    :root {
      --bg: #f9f9f7;
      --fg: #111111;
      --fg-muted: #555555;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #e8e8e6;
        --fg-muted: #a8a8a6;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 2rem);
    }

    main {
      max-width: 660px;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw + 1rem, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    p {
      color: var(--fg-muted);
      margin-top: 1rem;
    }

    a {
      color: var(--fg);
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found.</h1>
    <p><a href="/">→ Back to kohlhofer.com</a></p>
  </main>
</body>
</html>
